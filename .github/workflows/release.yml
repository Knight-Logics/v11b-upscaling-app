name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build NVIDIA RTX pack
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") {
            $match = Select-String -Path process_full_video_ultimate.py -Pattern '^APP_VERSION = "([^"]+)"$'
            if (!$match -or !$match.Matches.Count) { throw "Could not read APP_VERSION" }
            $ver = $match.Matches[0].Groups[1].Value
          }
          ./build_nvidia_pack.ps1 -AppVersion $ver

      - name: Pin NVIDIA pack integrity
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") {
            $match = Select-String -Path process_full_video_ultimate.py -Pattern '^APP_VERSION = "([^"]+)"$'
            if (!$match -or !$match.Matches.Count) { throw "Could not read APP_VERSION" }
            $ver = $match.Matches[0].Groups[1].Value
          }
          ./stamp_nvidia_release.ps1 -AppVersion $ver

      - name: Build executable
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") {
            $match = Select-String -Path process_full_video_ultimate.py -Pattern '^APP_VERSION = "([^"]+)"$'
            if (!$match -or !$match.Matches.Count) { throw "Could not read APP_VERSION" }
            $ver = $match.Matches[0].Groups[1].Value
          }
          ./build_release.ps1 -Version $ver

      - name: Build all-in-one NVIDIA edition
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") {
            $match = Select-String -Path process_full_video_ultimate.py -Pattern '^APP_VERSION = "([^"]+)"$'
            if (!$match -or !$match.Matches.Count) { throw "Could not read APP_VERSION" }
            $ver = $match.Matches[0].Groups[1].Value
          }
          ./build_nvidia_edition.ps1 -AppVersion $ver

      - name: Generate release checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Recurse -File |
            Where-Object {
              $_.Extension -in @('.exe', '.zip') -and
              ($_.Name -eq 'PixelForge-AI.exe' -or $_.Name -like 'PixelForge-AI_*.zip' -or
               $_.Name -like 'PixelForge-AI-NVIDIA_*.zip' -or $_.Name -like 'PixelForge-NVIDIA-Pack_*.zip')
            } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/v*/PixelForge-AI.exe
            release/v*/PixelForge-AI_*.zip
            release/v*/PixelForge-AI-NVIDIA_*.zip
            release/PixelForge-NVIDIA-Pack_*.zip
            release/PixelForge-NVIDIA-Pack_*.zip.sha256
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
